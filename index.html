<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Washly's · Mobile car wash, Gqeberha</title>
<meta name="description" content="Book Washly's mobile car wash in Gqeberha. We come to you. Free account, plus Fuel Friend: when to fill up and the cheapest diesel near you.">
<meta property="og:title" content="Washly's · We come to you">
<meta property="og:description" content="Book a car wash at your home or office in Gqeberha, and save on fuel with Fuel Friend.">
<meta name="theme-color" content="#0F3B50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Washly's">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
:root{
  --teal:#3A93A0; --teal-d:#2C7682; --teal-l:#DDEFF1; --navy:#0F3B50; --ink:#0F3B50; --muted:#5B7480;
  --bg:#F3F8F9; --card:#FFFFFF; --line:#D6E5E8; --ok:#23845A; --warn:#B9442B; --sun:#F2B33A;
  --f-head:"Poppins",system-ui,sans-serif; --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.chip,.nav a{-webkit-user-select:none;user-select:none}
.offline{position:sticky;top:0;z-index:30;background:var(--warn);color:#fff;text-align:center;font-weight:600;font-size:14px;padding:8px 12px}
.install{border-color:var(--teal);background:linear-gradient(0deg,#fff,var(--teal-l))}
.install .ios-share{display:inline-block;vertical-align:-3px;width:18px;height:18px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(28px,7vw,40px)}h2{font-size:21px}h3{font-size:17px}
p{margin:0}
a{color:var(--teal-d)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
/* header */
.top{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--f-head);font-weight:700;font-size:21px}
.brand svg{width:32px;height:32px}
.brand small{display:block;font:500 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.topr{display:flex;gap:8px;align-items:center}
.pill-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
.pill-btn.solid{background:var(--teal);border-color:var(--teal)}
.pill-btn{white-space:nowrap}
@media (max-width:460px){.topr .pill-btn:not(.solid){display:none}.brand small{display:none}}
/* nav: bottom bar on phones, tabs on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 2px;border-radius:10px}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--teal-d);background:var(--teal-l)}
@media (min-width:760px){
  body{padding-bottom:0}
  .nav{position:static;justify-content:flex-start;gap:4px;background:var(--navy);border:0;padding:0 max(16px,calc((100% - 920px)/2 + 16px)) 0}
  .nav a{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14px;color:rgba(255,255,255,.75);border-radius:0;padding:10px 14px;border-bottom:3px solid transparent}
  .nav a svg{width:18px;height:18px}
  .nav a[aria-current="page"]{color:#fff;background:transparent;border-bottom-color:var(--sun)}
}
main{padding:20px 0 40px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;min-height:46px}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.warn{background:#fff;color:var(--warn);border:1.5px solid #E6B3A8}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.chip:focus-visible,.nav a:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted)}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.err{color:var(--warn);font-weight:600}
.okmsg{color:var(--ok);font-weight:600}
.free{background:var(--teal-l);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px}
.hero{background:linear-gradient(135deg,var(--teal) 0%,var(--navy) 100%);color:#fff;border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.08)}
.hero .btn{background:#fff;color:var(--navy)}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:500}
.ticks li:before{content:"✓ ";color:var(--sun);font-weight:700}
/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.svc button,.svc .item{all:unset;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.svc .item{cursor:default}
.svc button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l);box-shadow:0 0 0 2px var(--teal) inset}
.svc .nm{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-family:var(--f-head);font-size:16px}
.svc .pr{color:var(--teal-d);white-space:nowrap}
.svc .ds{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.chip small{display:block;font-weight:500;font-size:11.5px;opacity:.8}
.summary{background:var(--navy);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.summary b{font-family:var(--f-head)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--teal-l);color:var(--teal-d);vertical-align:middle}
.badge.done{background:#E2F2EA;color:var(--ok)}.badge.cancelled,.badge.missed{background:#F6E3DE;color:var(--warn)}.badge.sun{background:#FCEFD2;color:#7A5200}
.bk{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.bk .when{font-family:var(--f-head);font-weight:600}
.dayh{font-family:var(--f-head);font-weight:600;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stamps span{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:14px}
.stamps span.on{background:var(--teal);border:2px solid var(--teal);color:#fff}
.stamps span.gift{border-color:var(--sun);color:#7A5200}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-head);font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
tr.best td{background:var(--teal-l)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.gauge{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.gauge.hero2{background:var(--navy);color:#fff;border-color:var(--navy)}
.gauge .g{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.gauge .p{font-family:var(--f-head);font-size:28px;font-weight:700}
.gauge .p small{font-size:14px;opacity:.7}
.gauge .d{font-size:13px;opacity:.85}
.up{color:var(--warn)}.down{color:var(--ok)}
.news-i{border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.news-i:last-child{border:0;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:760px){.toast{bottom:24px}}
.center{max-width:460px;margin:0 auto;width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--teal-d);font-weight:600;text-decoration:underline;cursor:pointer}
details.card summary{cursor:pointer;font-weight:700}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:12px 0 24px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#3A93A0"/><path d="M32 13c-8 11-13 18-13 26a13 13 0 0 0 26 0c0-8-5-15-13-26z" fill="#fff"/><path d="M25 40a7 7 0 0 0 7 7" stroke="#3A93A0" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span>Washly's<small>Mobile car wash · Gqeberha</small></span></a>
    <div class="topr" id="topr"></div>
  </div>
</header>
<div class="offline" id="offline" role="status" hidden>You're offline. You can look around, but booking needs a connection.</div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<main class="wrap" id="view" tabindex="-1"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ================= setup ================= */
const CFG=window.WASHLYS_CONFIG||{};const CT=CFG.contact||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ="Africa/Johannesburg";
const todayISO=()=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date());
const addD=(iso,n)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=iso=>new Date(iso+"T00:00:00Z").getUTCDay();
const fmtD=(iso,o={weekday:"short",day:"numeric",month:"short"})=>new Date(iso+"T00:00:00Z").toLocaleDateString("en-ZA",Object.assign({timeZone:"UTC"},o));
const R=n=>n==null?"Price to confirm":"R"+(+n).toFixed(2);
const SIZES={sedan:"Hatch / sedan",suv:"7-seater / SUV",minibus:"Minibus / taxi"};
const STATUS={booked:"Booked",done:"Done",cancelled:"Cancelled",missed:"Missed"};
const waLink=(num,text)=>`https://wa.me/${String(num||"").replace(/\D/g,"").replace(/^0/,"27")}${text?"?text="+encodeURIComponent(text):""}`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}

/* ================= data layer =================
   Everything that talks to the database goes through `api`, so the rules live in one place.
   The real rules (prices, free slots, who sees what) are enforced by the database itself. */
function supaApi(url,key){
  const sb=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const chk=r=>{if(r.error)throw new Error(r.error.message);return r.data};
  const back=location.origin+location.pathname;
  return {
    async session(){return (await sb.auth.getSession()).data.session},
    onAuth(cb){sb.auth.onAuthStateChange((ev,s)=>cb(ev,s))},
    async signUp(email,password,meta){const r=await sb.auth.signUp({email,password,options:{data:meta,emailRedirectTo:back}});if(r.error)throw new Error(r.error.message);return r.data},
    async signIn(email,password){return chk(await sb.auth.signInWithPassword({email,password}))},
    async signOut(){await sb.auth.signOut()},
    async resetPassword(email){return chk(await sb.auth.resetPasswordForEmail(email,{redirectTo:back}))},
    async updatePassword(password){return chk(await sb.auth.updateUser({password}))},
    async profile(id){return chk(await sb.from("profiles").select("*").eq("id",id).single())},
    async updateProfile(id,f){return chk(await sb.from("profiles").update(f).eq("id",id).select().single())},
    async services(){return chk(await sb.from("services").select("*").order("sort").order("id"))},
    async settings(){return chk(await sb.from("settings").select("*").eq("id",1).single())},
    async taken(a,b){return chk(await sb.rpc("taken_slots",{p_from:a,p_to:b}))},
    async book(o){return chk(await sb.rpc("book",{p_service:o.service,p_date:o.date,p_slot:o.slot,p_address:o.address||"",p_notes:o.notes||"",p_promo:o.promo||"",p_customer:o.customer||null}))},
    async bookings(){return chk(await sb.from("bookings").select("*").order("date").order("slot"))},
    async cancel(id){return chk(await sb.rpc("cancel_booking",{p_id:id}))},
    async move(id,date,slot){return chk(await sb.rpc("move_booking",{p_id:id,p_date:date,p_slot:slot}))},
    async deleteAccount(){chk(await sb.rpc("delete_my_account"));await sb.auth.signOut()},
    async profiles(){return chk(await sb.from("profiles").select("*").order("name"))},
    async updateBooking(id,f){return chk(await sb.from("bookings").update(f).eq("id",id).select().single())},
    async saveService(s){const {id,...f}=s;return id?chk(await sb.from("services").update(f).eq("id",id).select().single()):chk(await sb.from("services").insert(f).select().single())},
    async saveSettings(f){return chk(await sb.from("settings").update(f).eq("id",1).select().single())}
  };
}
const rawApi=window.__MOCK_API||(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase?supaApi(CFG.supabaseUrl,CFG.supabaseAnonKey):null);
/* Turn "Failed to fetch" / "Load failed" (no signal) into a message people understand. */
const NET=/failed to fetch|load failed|networkerror|network request failed|fetch failed/i;
const setOffline=on=>{const el=document.getElementById("offline");if(el)el.hidden=!on};
const api=rawApi&&new Proxy(rawApi,{get:(t,k)=>typeof t[k]!=="function"?t[k]:async(...a)=>{
  try{const r=await t[k](...a);setOffline(false);return r}
  catch(e){if(!navigator.onLine||NET.test(e.message||"")){setOffline(true);throw new Error("No connection. Check your signal and try again.")}throw e}}});

/* ================= state ================= */
const S={session:null,me:null,services:[],settings:null,bookings:[],profiles:[],taken:[],fuel:null,fuelErr:"",fuelCity:"gqb",
  book:null,done:null,adminFilter:"upcoming",custQ:"",recovery:false,loading:true};
try{S.fuelCity=localStorage.getItem("washlys-fuel-city")||"gqb"}catch(e){}
const qs=new URLSearchParams(location.search);
const PROMO_IN=(qs.get("promo")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const FROM_FF=/fuel/i.test(qs.get("from")||"")||!!PROMO_IN;
try{if(PROMO_IN)sessionStorage.setItem("washlys-promo",PROMO_IN)}catch(e){}
const promoSaved=()=>{try{return sessionStorage.getItem("washlys-promo")||""}catch(e){return PROMO_IN}};
const isAdmin=()=>!!(S.me&&S.me.is_admin);
const setts=()=>S.settings||{slots:["08:00","10:00","12:00","14:00","16:00"],open_days:[1,2,3,4,5,6],days_ahead:14,loyalty_every:6,size_extra:{sedan:0,suv:20,minibus:50}};
const extraFor=size=>+((setts().size_extra||{})[size]||0);

async function loadPublic(){
  if(!api)return;
  const [sv,st]=await Promise.all([api.services(),api.settings()]);S.services=sv||[];S.settings=st;
}
async function loadMe(){
  if(!api||!S.session){S.me=null;S.bookings=[];S.profiles=[];return}
  S.me=await api.profile(S.session.user.id);
  S.bookings=await api.bookings()||[];
  S.profiles=isAdmin()?(await api.profiles()||[]):[S.me];
}
async function loadTaken(){
  if(!api)return;const t=todayISO();
  S.taken=(await api.taken(t,addD(t,setts().days_ahead+35)))||[];
}
const takenSet=()=>new Set(S.taken.map(x=>(typeof x.date==="string"?x.date.slice(0,10):x.date)+" "+x.slot));

/* ================= routing ================= */
const ICON={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  book:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M7 7h5v4H7zM15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a6.5 6.5 0 0 1 3.5 6.5"/>',
  tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',

function navItems(){

  if(S.me)return [["home","Home","home"],["book","Book","book"],["washes","My washes","list"],["fuel","Fuel Friend","fuel"],["account","Account","user"]];

function route(){
  const h=(location.hash||"#/").replace(/^#\/?/,"");const [v,arg]=h.split("/");

  if(!allowed.has(view))view=S.me?(isAdmin()?"today":"home"):(["book","washes","account"].includes(view)?"login":"home");
  if(isAdmin()&&view==="home")view="today";

}

/* ---------- book ---------- */
function bookState(customerId){
  if(!S.book||S.book.customer!==customerId)S.book={svc:null,date:null,slot:null,address:"",notes:"",promo:customerId?"":promoSaved(),customer:customerId||null};
  return S.book;
}
function bookableDays(adminMode){
  const st=setts(),t=todayISO(),out=[];
  for(let i=adminMode?0:1;i<=st.days_ahead;i++){const d=addD(t,i);if(st.open_days.includes(dow(d)))out.push(d)}
  return out;
}
function slotFree(d,s,svc,ts){const weeks=svc&&svc.kind==="monthly"?4:1;for(let i=0;i<weeks;i++)if(ts.has(addD(d,7*i)+" "+s))return false;return true}
function estimate(b,svc,cust){
  if(!svc)return null;const ex=extraFor(cust.car_size),list=S.bookings.filter(x=>x.customer_id===cust.id&&x.status!=="cancelled");
  if(svc.custom)return {each:null,total:null,text:`Price to confirm (R${(+svc.price).toFixed(0)}–R${(+svc.price_max).toFixed(0)} for the month). We'll agree it with you.`};
  if(svc.kind==="monthly"){const tot=+svc.price+4*ex;return {total:tot,text:`${R(tot)} for 4 washes${ex?` (includes +R${ex} per wash for ${SIZES[cust.car_size].toLowerCase()})`:""}`}}
  const base=+svc.price+ex,st=stampInfo(list);

async function bookingAction(e){
  const btn=e.target.closest("[data-act]");if(!btn)return;const card=btn.closest("[data-bk]");if(!card)return;
  const id=+card.dataset.bk,b=S.bookings.find(x=>x.id===id);if(!b)return;const act=btn.dataset.act;
  try{
    if(act==="cancel"){if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="Tap again to cancel";return}await api.cancel(id);toast("Wash cancelled")}
    else if(act==="status"){await api.updateBooking(id,{status:btn.dataset.st});toast("Marked "+STATUS[btn.dataset.st].toLowerCase())}
    else if(act==="price"){const m=card.querySelector(".mover");m.innerHTML=`<div class="row"><label style="flex:1">Price (R)<input type="number" min="0" step="0.01" value="${b.price??""}" data-in="price"></label><button class="btn sm" data-act="savePrice">Save</button></div>`;return}
    else if(act==="savePrice"){const v=card.querySelector("[data-in=price]").value;await api.updateBooking(id,{price:v===""?null:+v});toast("Price saved")}
    else if(act==="move"){await loadTaken();const ts=takenSet(),days=bookableDays(isAdmin()).concat(isAdmin()?[]:[]);const m=card.querySelector(".mover");
      m.innerHTML=`<div class="grid"><label>New day<select data-in="day">${days.map(d=>`<option value="${d}" ${d===b.date?"selected":""}>${fmtD(d)}</option>`).join("")}</select></label>
        <label>New time<select data-in="slot"></select></label></div><div class="row"><button class="btn sm" data-act="saveMove">Move this wash</button><button class="btn sm ghost" data-act="closeMove">Keep it</button></div>`;
      const ds=m.querySelector("[data-in=day]"),ss=m.querySelector("[data-in=slot]");
      const fill=()=>{ss.innerHTML=setts().slots.map(s=>{const mine=ds.value===b.date&&s===b.slot,free=mine||!ts.has(ds.value+" "+s);return `<option value="${s}" ${free?"":"disabled"} ${mine?"selected":""}>${s}${free?"":" (taken)"}</option>`}).join("")};ds.onchange=fill;fill();return}
    else if(act==="closeMove"){card.querySelector(".mover").innerHTML="";return}
    else if(act==="saveMove"){const d=card.querySelector("[data-in=day]").value,s=card.querySelector("[data-in=slot]").value;await api.move(id,d,s);toast(`Moved to ${fmtD(d)} at ${s}`)}
    else return;
    await Promise.all([loadMe(),loadTaken()]);const y=window.scrollY;render();window.scrollTo(0,y);
  }catch(x){toast(x.message)}
}

  if(!s.name){m.className="small err";m.textContent="Add a name.";return}if(s.custom&&!(s.price_max>=s.price)){m.className="small err";m.textContent="For a range, set 'Up to' to at least the price.";return}
  if(f.dataset.svcform)s.id=+f.dataset.svcform;
  try{await api.saveService(s);S.services=await api.services();toast("Saved");render()}catch(x){m.className="small err";m.textContent=x.message}})};

const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
VIEWS.settings=()=>{const st=setts();return `<div class="stack"><h1>Settings</h1>
  <form class="card" id="fSet" novalidate>
    <h2>When customers can book</h2>
    <label>Booking times (one van, so one booking per time)<input name="slots" value="${esc(st.slots.join(", "))}" placeholder="08:00, 10:00, 12:00"></label>
    <div><span class="small muted" style="font-weight:600">Days you wash</span><div class="chips" style="margin-top:6px">${DAYN.map((d,i)=>`<label class="chip" style="flex-direction:row;gap:6px;color:var(--ink)"><input type="checkbox" name="day" value="${i}" ${st.open_days.includes(i)?"checked":""} style="width:auto">${d}</label>`).join("")}</div></div>
    <label>How many days ahead customers can book<input name="days_ahead" type="number" min="1" max="60" value="${st.days_ahead}"></label>
    <h2>Loyalty and vehicle sizes</h2>
    <label>Every how many once-off washes is one free? (0 = no loyalty card)<input name="loyalty_every" type="number" min="0" max="20" value="${st.loyalty_every}"></label>
    <div class="grid"><label>Extra for a 7-seater / SUV (R per wash)<input name="suv" type="number" min="0" step="1" value="${(st.size_extra||{}).suv||0}"></label>
    <label>Extra for a minibus / taxi (R per wash)<input name="minibus" type="number" min="0" step="1" value="${(st.size_extra||{}).minibus||0}"></label></div>
    <p id="setMsg" role="status"></p><button class="btn" type="submit">Save settings</button></form>
  <div class="card"><h2>Your admin account</h2><p class="small">${esc(S.me.name)} · ${esc(S.me.email)}</p><div class="row"><a class="btn ghost sm" href="#/account">Change my password</a><button class="btn ghost sm" data-act="logout">Log out</button></div></div></div>`};
AFTER.settings=()=>{$("#fSet").onsubmit=async e=>{e.preventDefault();const f=e.target,m=$("#setMsg"),fd=new FormData(f);
  const slots=String(fd.get("slots")).split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).map(s=>/^\d:\d\d$/.test(s)?"0"+s:s);
  if(!slots.length||slots.some(s=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(s))){m.className="err";m.textContent="Write times like 08:00, 10:00, 12:00.";return}
  const days=fd.getAll("day").map(Number);if(!days.length){m.className="err";m.textContent="Pick at least one day.";return}
  try{S.settings=await api.saveSettings({slots:[...new Set(slots)].sort(),open_days:days.sort(),days_ahead:+fd.get("days_ahead")||14,loyalty_every:+fd.get("loyalty_every")||0,size_extra:{sedan:0,suv:+fd.get("suv")||0,minibus:+fd.get("minibus")||0}});m.className="okmsg";m.textContent="Saved. Customers see the new times straight away."}catch(x){m.className="err";m.textContent=x.message}}};

/* ================= Fuel Friend section =================
   Reads the data block from the Fuel Friend page on the same site, so both always show the same figures. */
async function loadFuel(){
  if(S.fuel||S.fuelErr)return;
  try{const r=await fetch(CFG.fuelData||"/Fuel_Friend/index.html",{cache:"no-cache"});if(!r.ok)throw new Error(r.status);const h=await r.text();
    const a=h.indexOf("const DATA=");if(a<0)throw new Error("no data");const b=h.indexOf("\n};\n",a);
    S.fuel=Function('"use strict";return ('+h.slice(h.indexOf("{",a),b+2)+")")();
  }catch(e){S.fuelErr="Fuel Friend's prices couldn't be loaded right now."}
}
const daysUntil=iso=>Math.round((new Date(iso+"T00:00:00Z")-new Date(todayISO()+"T00:00:00Z"))/864e5);
const dmyToIso=s=>{const [d,m,y]=String(s).split("-");return `${y}-${m}-${d}`};
const midOf=ps=>{const a=ps.slice().sort((x,y)=>x-y);return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):0};
const BRANDS=["Astron Energy","Ener-Gi","Elegant","Co-Op Total","Total Energies","TotalEnergies","Total","BP","Caltex","Engen","Independent","MBT","Puma","Q4","Quest","Sasol","Shell","Viva"];
const PLACE=/^(gqeberha|port elizabeth|ethekwini|durban|tshwane|pretoria|mangaung|bloemfontein|cape town|mbombela|nelspruit|johannesburg|east london|pietermaritzburg|george|rustenburg|sandton|randburg|cnr|1)$/i;
function cleanName(n){n=n.replace(/\s+/g," ").trim().replace(/^Truck Stop (?=\S)/,"").replace(/^Total Energies (?=Total )/,"");const w=n.split(" ");for(const k of [2,1]){if(w.length>2*k-1&&w.slice(0,k).join(" ").toLowerCase()===w.slice(k,2*k).join(" ").toLowerCase())return w.slice(k).join(" ")}return n}
function cleanWhere(w){const p=String(w||"").replace(/^\d+(?=[A-Za-z])/,"").split("/").map(x=>x.trim()).filter(x=>x&&!PLACE.test(x));return p.length?p[p.length-1]:""}
function fuelCities(){
  const D=S.fuel;return Object.entries(D.stations||{}).map(([id,c])=>{
    const zone=(D.zones||{})[id]||"inland",ws=D.official[zone].d50w;
    const all=(c.rows||[]).filter(r=>typeof r[2]==="number").map(r=>({name:cleanName(String(r[0])),where:cleanWhere(r[1]),price:r[2],upd:dmyToIso(r[3])}));
    const m=midOf(all.map(s=>s.price)),ok=all.filter(s=>s.price>=20&&s.price<=50&&s.price>=m-4.5&&s.price<=m+4&&s.price>=ws-2);
    const fresh=ok.filter(s=>s.upd>=D.official.effective),L=(fresh.length>=8?fresh:ok).sort((a,b)=>a.price-b.price);
    return {id,name:c.name,zone,S:L,median:midOf(L.map(s=>s.price)),cheapest:L[0]};
  });
}
function moveText(){const f=S.fuel.forecast,d=daysUntil(f.effective),when=fmtD(f.effective,{weekday:"long",day:"numeric",month:"long"});
  const ch=v=>typeof v!=="number"?"":`<b class="${v>0?"up":"down"}">${v>0?"up":"down"} about R${Math.abs(v).toFixed(2)}</b>`;
  if(d<=0)return `Prices changed on ${when}. New figures follow shortly.`;
  return typeof f.d50==="number"?`<b>${when}</b> (in ${d} day${d===1?"":"s"}): diesel ${ch(f.d50)}, petrol 95 ${ch(f.p95)} a litre. Estimate, not yet official.`:`<b>${when}</b> (in ${d} day${d===1?"":"s"}): no reliable estimate yet.`}
const fuelTeaser=()=>`<a class="card" href="#/fuel" style="text-decoration:none;color:inherit;border-color:var(--teal)" id="fuelTeaser"><div class="between"><span class="eyebrow">Fuel Friend</span><span class="small">Open →</span></div><h2>Save on fuel too</h2><p class="muted small">When to fill up, and the cheapest diesel near you.</p></a>`;
async function fuelTeaserFill(){const el=$("#fuelTeaser");if(!el)return;await loadFuel();if(!S.fuel||!$("#fuelTeaser"))return;
  const c=fuelCities().find(x=>x.id==="gqb");
  $("#fuelTeaser").innerHTML=`<div class="between"><span class="eyebrow">Fuel Friend</span><span class="small">More →</span></div><p>${moveText()}</p>${c&&c.cheapest?`<p class="small">Cheapest diesel in Gqeberha: <b>R${c.cheapest.price.toFixed(2)}</b> at ${esc(c.cheapest.name)}.</p>`:""}`}
VIEWS.fuel=()=>`<div class="stack" id="fuelBox"><div><span class="eyebrow">Fuel Friend by Washly's</span><h1>Spend less on fuel</h1></div><p class="muted">Loading today's prices…</p></div>`;
AFTER.fuel=async()=>{await loadFuel();const box=$("#fuelBox");if(!box)return;
  if(!S.fuel){box.innerHTML=`<h1>Fuel Friend</h1><div class="card"><p>${esc(S.fuelErr)}</p><a class="btn" href="${esc(CFG.fuelPage||"/Fuel_Friend/")}">Open Fuel Friend</a></div>`;return}
  const D=S.fuel,C=fuelCities();if(!C.some(c=>c.id===S.fuelCity))S.fuelCity="gqb";const c=C.find(x=>x.id===S.fuelCity),off=D.official[c.zone];
  const top=c.S.slice(0,10),min=c.cheapest?c.cheapest.price:0;
  box.innerHTML=`<div class="between"><div><span class="eyebrow">Fuel Friend by Washly's</span><h1>Spend less on fuel</h1></div>
      <label style="min-width:220px">Your city<select id="fCity">${C.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label></div>
    <div class="gauges">
      ${c.S.length?`<div class="gauge hero2"><span class="g">Diesel 50ppm · ${esc(c.name.replace(/ \(.*\)/,""))} middle</span><span class="p">R${c.median.toFixed(2)}<small>/L</small></span><span class="d">${c.S.length} stations</span></div>
      <div class="gauge"><span class="g">Cheapest diesel</span><span class="p">R${min.toFixed(2)}<small>/L</small></span><span class="d">${esc(c.cheapest.name)}</span></div>`:""}
      <div class="gauge"><span class="g">Petrol 95 · ${c.zone}</span><span class="p">R${off.p95.toFixed(2)}<small>/L</small></span><span class="d">Same at every station</span></div>
      <div class="gauge"><span class="g">Petrol 93 · ${c.zone}</span><span class="p">R${off.p93.toFixed(2)}<small>/L</small></span><span class="d">Same at every station</span></div>
    </div>
    <div class="card"><h2>When to fill up</h2><p>${moveText()}</p>${D.forecast.note?`<p class="small muted">${esc(D.forecast.note)}</p>`:""}
      ${daysUntil(D.forecast.effective)>0&&typeof D.forecast.d50==="number"?`<p class="small"><b>Diesel:</b> ${D.forecast.d50>0?"fill up before":"wait until"} ${fmtD(D.forecast.effective,{day:"numeric",month:"short"})} if you can. <b>Petrol:</b> ${D.forecast.p95>0?"fill up before":"wait until"} ${fmtD(D.forecast.effective,{day:"numeric",month:"short"})} if you can.</p>`:""}</div>
    ${top.length?`<div class="card"><div class="between"><h2>Cheapest diesel in ${esc(c.name.replace(/ \(.*\)/,""))}</h2><span class="small muted">Checked ${fmtD(D.stationsChecked,{day:"numeric",month:"short"})}</span></div>
      <div class="tbl"><table><thead><tr><th>Station</th><th class="n">Diesel</th><th class="n">vs cheapest</th></tr></thead><tbody>${top.map(s=>`<tr class="${s.price===min?"best":""}"><td><b>${esc(s.name)}</b>${s.where?`<br><span class="tiny muted">${esc(s.where)}</span>`:""}</td><td class="n">R${s.price.toFixed(2)}</td><td class="n">${s.price===min?"Cheapest":"+R"+(s.price-min).toFixed(2)}</td></tr>`).join("")}</tbody></table></div>
      <p class="tiny muted">Prices reported by drivers and stations on myTank. Check the pump before a full tank.</p></div>`:""}
    <div class="card"><h2>Fuel news</h2>${(D.news||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(n=>`<div class="news-i"><span class="tiny muted">${fmtD(n.date,{day:"numeric",month:"short"})} · <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.src)}</a></span><b>${esc(n.title)}</b>${n.you?`<span class="small">What it means: ${esc(n.you)}</span>`:""}</div>`).join("")}</div>
    <div class="row"><a class="btn ghost" href="${esc(CFG.fuelPage||"/Fuel_Friend/")}">Open the full Fuel Friend (map, rewards cards, all stations)</a></div>
    <p class="tiny muted">Official prices from ${fmtD(D.official.effective,{day:"numeric",month:"long"})}: <a href="${esc(D.official.src.url)}" target="_blank" rel="noopener">${esc(D.official.src.name)}</a>.</p>`;
  $("#fCity").onchange=e=>{S.fuelCity=e.target.value;try{localStorage.setItem("washlys-fuel-city",S.fuelCity)}catch(x){}AFTER.fuel()}};

/* Shown until the database is connected (same as the price list in the database setup). */
const PRICE_LIST=[["Wash & Dry","once",75,null,"Outside wash and tyre polish"],["Full Wash","once",120,null,"Outside wash, tyre polish, vacuum, dash shine and air freshener"],["Inside Wash","once",60,null,"Vacuum, dash shine and air freshener"],["Vacuuming","once",40,null,"Vacuum only"],
  ["Basic Wash Monthly Package","monthly",270,null,"4 washes a month, same day and time each week"],["Wash X Inside Package","monthly",250,null,"4 washes a month, same day and time each week"],["Full Wash Package","monthly",420,null,"4 washes a month, same day and time each week"],["Custom Package","monthly",150,420,"4 washes a month, made up the way you want. We confirm the price with you (R150 to R420)."]]
  .map(([name,kind,price,price_max,description],i)=>({id:i+1,name,kind,price,price_max,custom:price_max!=null,description,active:true,sort:i+1}));
/* ================= start ================= */
(async function start(){
  try{
    if(api){
      api.onAuth(async(ev,s)=>{if(ev==="PASSWORD_RECOVERY"){S.recovery=true;S.session=s;render();return}
        if(ev==="SIGNED_OUT"){S.session=null;S.me=null;S.bookings=[];S.profiles=[];render()}
        if(ev==="SIGNED_IN"&&s&&!S.me&&!S.loading){S.session=s;try{await loadMe()}catch(e){}render()}});
      await loadPublic();S.session=await api.session();if(S.session)await loadMe();await loadTaken();
    }
  }catch(e){console.error(e);toast("Couldn't reach the booking system. Check your connection and refresh.")}
  if(!S.services.length)S.services=PRICE_LIST;
  S.loading=false;render();
})();
/* Offline banner */
window.addEventListener("online",async()=>{setOffline(false);if(api){try{await loadPublic();if(S.session)await loadMe();await loadTaken();render()}catch(e){}}});
window.addEventListener("offline",()=>setOffline(true));if(!navigator.onLine)setOffline(true);
/* Coming back to the app (switching apps on the phone): fetch the latest bookings and free times. */
let lastSync=Date.now();
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!api||!navigator.onLine||Date.now()-lastSync<30000)return;lastSync=Date.now();
  if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  try{await loadPublic();if(S.session)await loadMe();await loadTaken();const y=window.scrollY;render();window.scrollTo(0,y)}catch(e){}});
/* Offline support and home-screen install */
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&!window.__MOCK_API_NO_SW){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
